  Motion type: STATIC (a hover micro-interaction — nudge right 4px on
  hover/focus — is stubbed via CSS but no scroll/loop motion is intended)
  Description: Trailing arrow icon used after every text link ("Read",
  "Consulting", "LinkedIn", etc.) throughout the site.
  Used in: index.html hero quicklinks, offering rows, veterans, articles.
-->

<html lang="en">
<head>

  }
  .text-link svg { transition: transform 0.2s ease; }
  .text-link:hover svg, .text-link:focus-visible svg { transform: translateX(4px); }
</style>
</head>
