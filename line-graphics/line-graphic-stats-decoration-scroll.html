<!--
  Motion type: SCROLL (triggers once on scroll into view)
  Description: Large decorative network/line illustration in the navy
  "Thira" stats band. Starts in .pre-reveal resting state (0 opacity,
  offset down) and should fade/slide in once when scrolled into view.
  Note: source is a complex multi-path illustration (~350 line segments)
  exported directly from Figma as images/stats-decoration-graphic.svg —
  referenced here rather than re-inlined, so the real vector data (not a
  hand-drawn approximation) stays a single source of truth. Swap the
  <img> for an inline <svg> if you need to animate individual paths.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Line graphic — stats decoration (scroll reveal)</title>
<style>
  body { margin: 0; padding: 40px; background: #09264d; }
  .pre-reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .pre-reveal.is-visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .pre-reveal { opacity: 1; transform: none; transition: none; }
  }
  #stats-decoration { display: block; width: 60vw; max-width: 787px; }
</style>
</head>
<body>

<img id="stats-decoration" class="pre-reveal" src="../images/stats-decoration-graphic.svg" alt="" aria-hidden="true" />

<script>
  var el = document.getElementById("stats-decoration");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) { entry.target.classList.add("is-visible"); io.unobserve(entry.target); }
      });
    }, { threshold: 0.2 });
    io.observe(el);
  } else {
    el.classList.add("is-visible");
  }
</script>

</body>
</html>
